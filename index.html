<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKICHIP V2: DAILY SOLVER - QUEST</title>
  
  <!-- 引入 Google Fonts: Bagel Fat One, Baloo Bhaijaan 2 与 Ma Shan Zheng -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+Bhaijaan+2:wght@400;600;800&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  
  <style>
    /* 全局变量 */
    :root {
      --bg-color: #F8F6F3;        /* 背景颜色 */
      --main-color: #9B644F;      /* 主线条与主字体颜色 */
      --accent-color: #FCA125;    /* Quest 答案字颜色 */
      --card-bg: #FFFFFF;         /* 卡片背景 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      /* 整体左右两边的白色留白加宽至 32px */
      padding: 20px 32px 50px;
      color: var(--main-color);
    }

    /* 手机端容器 */
    .mobile-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 1. 最顶部的画作与紧贴的圆角横线 */
    .top-illustration-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .top-illustration-img {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
    }

    /* 紧密粘着在图画下面的横线 */
    .top-tight-line {
      width: 100%;
      height: 3px;
      background-color: var(--main-color);
      border-radius: 3px;
      margin-top: 0;
    }

    /* 2. 主标题 */
    .main-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: clamp(16px, 5.2vw, 22px);
      font-weight: 400;
      color: var(--main-color);
      text-align: center;
      letter-spacing: 0.05em;
      white-space: nowrap;
      width: 100%;
      margin-top: 2px;
      margin-bottom: 2px;
    }

    /* 3. 通用卡片外框 */
    .card-box {
      width: 100%;
      background: var(--card-bg);
      border: 3px solid var(--main-color);
      border-radius: 24px;
      position: relative;
    }

    /* 三按钮容器 */
    .options-box {
      padding: 18px 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    /* 按钮样式与按压效果 */
    .quest-btn {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .quest-btn:active {
      transform: scale(0.8);
    }

    /* 按钮 PNG 图（放大 15%：75px） */
    .quest-btn-img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      margin-bottom: 8px;
      display: block;
    }

    /* 按钮英文文字（14px） */
    .quest-btn span {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 14px;
      color: var(--main-color);
      text-align: center;
      letter-spacing: 0.05em;
      line-height: 1.25;
      text-transform: uppercase;
    }

    /* 4. Quest 展示区 */
    .display-box {
      padding: 24px 15px 60px 15px;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .quest-header-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 22px;
      color: var(--main-color);
      letter-spacing: 0.05em;
      white-space: nowrap;
      margin-bottom: 20px;
    }

    /* 动态任务文本区域 */
    .quest-content-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 0 30px;
      transition: opacity 0.1s ease;
    }

    .quest-content-area.rolling {
      filter: blur(1px);
      opacity: 0.7;
    }

    /* Quest 中文字体：Ma Shan Zheng (18pt) */
    .zh-text {
      font-family: 'Ma Shan Zheng', cursive, sans-serif;
      color: var(--accent-color);
      font-size: 18pt;
      line-height: 1.5;
      margin-bottom: 12px;
      word-break: break-word;
    }

    /* Quest 英文字体：Baloo Bhaijaan Regular */
    .en-text {
      font-family: 'Baloo Bhaijaan 2', 'Baloo Bhaijaan', cursive, sans-serif;
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.35;
      word-break: break-word;
    }

    /* 5. Instagram 按钮（位置保持原封不动） */
    .ig-badge-link {
      position: absolute;
      bottom: -30px;
      right: -10px;
      text-decoration: none;
      z-index: 10;
      transition: transform 0.15s ease;
    }

    .ig-badge-link:active {
      transform: scale(0.8);
    }

    .ig-btn-img {
      height: 105px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- 1. 顶部图画 + 紧贴的圆边横线 -->
    <div class="top-illustration-wrapper">
      <img src="top-muki.png" alt="Muki Illustration" class="top-illustration-img" onerror="this.style.display='none'">
      <div class="top-tight-line"></div>
    </div>

    <!-- 2. 主标题 -->
    <h1 class="main-title">MUKICHIP V2: DAILY SOLVER</h1>

    <!-- 3. 三按钮选框 -->
    <div class="card-box options-box">
      
      <!-- 按钮 1: MINI ADVENTURE -->
      <button class="quest-btn" onclick="selectQuest('mini')">
        <img src="mini-icon.png" alt="Mini Adventure" class="quest-btn-img">
        <span>MINI<br>ADVENTURE</span>
      </button>

      <!-- 按钮 2: INNER QUEST -->
      <button class="quest-btn" onclick="selectQuest('inner')">
        <img src="inner-icon.png" alt="Inner Quest" class="quest-btn-img">
        <span>INNER<br>QUEST</span>
      </button>

      <!-- 按钮 3: RANDOM QUEST -->
      <button class="quest-btn" onclick="selectQuest('random')">
        <img src="random-icon.png" alt="Random Quest" class="quest-btn-img">
        <span>RANDOM<br>QUEST</span>
      </button>

    </div>

    <!-- 4. Quest 结果卡片 -->
    <div class="card-box display-box">
      <div class="quest-header-title">- QUEST -</div>
      
      <div class="quest-content-area" id="questContentArea">
        <p class="zh-text" id="zhDisplay">在安全的公共区域选一个方向走 5 分钟，再按原路或熟悉路线回来。</p>
        <p class="en-text" id="enDisplay">Walk in one direction for 5 minutes within a safe public area, then return via the same path or a familiar route.</p>
      </div>

      <!-- 5. 右下角 Instagram 图片按钮 -->
      <a href="https://www.instagram.com/yuxuantsuki" target="_blank" rel="noopener noreferrer" class="ig-badge-link">
        <img src="ig-button.png" alt="@yuxuantsuki" class="ig-btn-img">
      </a>
    </div>

  </div>

  <script>
    /* ========================================================
       QUEST 任务数据池
       ======================================================== */
    
    // 1. Mini Adventure 户外/探索类
    const miniQuests = [
      {
        zh: "在安全的公共区域选一个方向走 5 分钟，再按原路或熟悉路线回来。",
        en: "Walk in one direction for 5 minutes within a safe public area, then return via the same path or a familiar route."
      },
      {
        zh: "去最近的便利店盲买一瓶你从没喝过的饮料。",
        en: "Go to the nearest convenience store and randomly buy a drink you have never tried before."
      },
      {
        zh: "寻找一条马路上带有“小动物”或“植物”图案的盖板，拍照记录。",
        en: "Find a manhole cover or sign with an animal or plant design on the street and take a picture."
      }
    ];

    // 2. Inner Quest 内心/治愈类
    const innerQuests = [
      {
        zh: "闭上眼睛深呼吸 5 次，在心中对自己说一句“你今天做得很好”。",
        en: "Close your eyes, take 5 deep breaths, and tell yourself silently: 'You did great today.'"
      },
      {
        zh: "给一位很久没联系的好朋友发一条“突然想起你，祝你今天开心”。",
        en: "Send a quick message to a friend you haven't talked to in a while: 'Thinking of you, hope you have a great day!'"
      },
      {
        zh: "在备忘录里写下今天让你感到幸运或感谢的 3 件微小事物。",
        en: "Write down 3 tiny things in your notes that you felt lucky or grateful for today."
      }
    ];

    /* ========================================================
       2 秒滚轮抽签逻辑
       ======================================================== */
    let isRolling = false;

    function selectQuest(type) {
      if (isRolling) return;
      isRolling = true;

      let pool = [];
      if (type === 'mini') {
        pool = miniQuests;
      } else if (type === 'inner') {
        pool = innerQuests;
      } else {
        // Random Quest: 混合 Mini 与 Inner
        pool = [...miniQuests, ...innerQuests];
      }

      const contentArea = document.getElementById('questContentArea');
      const zhDisplay = document.getElementById('zhDisplay');
      const enDisplay = document.getElementById('enDisplay');

      contentArea.classList.add('rolling');

      const duration = 2000;    // 2秒
      const intervalTime = 60;  // 60ms 快速轮播
      let elapsedTime = 0;

      const timer = setInterval(() => {
        const tempIndex = Math.floor(Math.random() * pool.length);
        zhDisplay.textContent = pool[tempIndex].zh;
        enDisplay.textContent = pool[tempIndex].en;

        elapsedTime += intervalTime;

        if (elapsedTime >= duration) {
          clearInterval(timer);
          
          const finalIndex = Math.floor(Math.random() * pool.length);
          zhDisplay.textContent = pool[finalIndex].zh;
          enDisplay.textContent = pool[finalIndex].en;

          contentArea.classList.remove('rolling');
          isRolling = false;
        }
      }, intervalTime);
    }
  </script>
</body>
</html>
