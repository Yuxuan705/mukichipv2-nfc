<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKICHIP V2: DAILY SOLVER - QUEST</title>
  
  <!-- 引入 Google 字体: Bagel Fat One 与 Baloo Bhaijaan 2 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* 本地/自定义中文字体定义: 方正胖娃_GBK */
    @font-face {
      font-family: '方正胖娃_GBK';
      src: local('方正胖娃_GBK'), local('FZPangWa-M18S');
    }

    /* CSS 变量配置 */
    :root {
      --bg-color: #F8F6F3;        /* 指定背景色 */
      --main-brown: #9B644F;      /* 指定主线条与字色 */
      --quest-orange: #FCA125;    /* 指定任务文字配色 */
      --card-bg: #FFFFFF;         /* 卡片背景纯白 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 16px 40px;
      color: var(--main-brown);
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* 移动端容器 */
    .mobile-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 1. 最顶部的插图区域 */
    .top-illustration-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-illustration-wrap img {
      max-width: 220px;
      height: auto;
      display: block;
    }

    /* 插图正下方紧密粘着的横线 */
    .attached-divider {
      width: 100%;
      height: 0;
      border: none;
      border-bottom: 3px solid var(--main-brown);
      margin-top: 0;           /* 紧密贴合上图 */
      margin-bottom: 18px;     /* 与下方标题拉开间距 */
    }

    /* 2. 主标题 */
    .main-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--main-brown);
      text-align: center;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    /* 通用圆角外框卡片 */
    .card-box {
      width: 100%;
      background: var(--card-bg);
      border: 3px solid var(--main-brown);
      border-radius: 24px;
      position: relative;
    }

    /* 3. 三选一按钮框 */
    .options-box {
      padding: 18px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .quest-btn {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease;
    }

    .quest-btn:active {
      transform: scale(0.92);
    }

    /* 按钮里的图片容器 */
    .btn-icon {
      width: 52px;
      height: 52px;
      object-fit: contain;
      margin-bottom: 8px;
      display: block;
    }

    /* 按钮标题文字 */
    .quest-btn span {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 13px;
      line-height: 1.15;
      color: var(--main-brown);
      text-align: center;
      font-weight: 400;
    }

    /* 4. QUEST 展示卡片 */
    .display-box {
      padding: 24px 20px 48px 20px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .quest-header-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 20px;
      color: var(--main-brown);
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    /* 任务文本区域 */
    .quest-content-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 0 8px;
      transition: filter 0.1s ease, transform 0.1s ease;
    }

    /* 滚轮动画状态 */
    .quest-content-area.rolling {
      filter: blur(1.5px);
      transform: scale(0.98);
    }

    /* 任务中文字体: 方正胖娃_GBK */
    .zh-text {
      font-family: '方正胖娃_GBK', 'FZPangWa-M18S', 'Yuanti SC', 'PingFang SC', sans-serif;
      color: var(--quest-orange);
      font-size: 19px;
      line-height: 1.5;
      margin-bottom: 10px;
      word-break: break-word;
    }

    /* 任务英文字体: Baloo Bhaijaan 2 */
    .en-text {
      font-family: 'Baloo Bhaijaan 2', cursive, sans-serif;
      color: var(--quest-orange);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
    }

    /* 5. 右下角 Instagram 贴纸挂件按钮 */
    .ig-badge-link {
      position: absolute;
      bottom: -16px;
      right: -6px;
      display: block;
      z-index: 10;
      transition: transform 0.15s ease;
    }

    .ig-badge-link:hover {
      transform: scale(1.06) rotate(-2deg);
    }

    .ig-badge-link img {
      height: 42px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- 1. 顶部手绘图案 + 紧密粘着的分割线 -->
    <div class="top-illustration-wrap">
      <!-- 提示: 替换 src 你的插图文件路径 (例如: top_muki.png) -->
      <img src="top_muki.png" alt="Muki Illustration">
      <hr class="attached-divider">
    </div>

    <!-- 2. 主标题 -->
    <h1 class="main-title">MUKICHIP V2: DAILY SOLVER</h1>

    <!-- 3. 三选一按钮框 -->
    <div class="card-box options-box">
      <!-- 按钮 1: Mini Adventure -->
      <button class="quest-btn" onclick="selectQuest('mini')">
        <!-- 提示: 替换你的 Mini Adventure 图标文件 -->
        <img src="icon_mini_adventure.png" alt="Mini Adventure" class="btn-icon">
        <span>Mini<br>Adventure</span>
      </button>

      <!-- 按钮 2: Inner Quest -->
      <button class="quest-btn" onclick="selectQuest('inner')">
        <!-- 提示: 替换你的 Inner Quest 图标文件 -->
        <img src="icon_inner_quest.png" alt="Inner Quest" class="btn-icon">
        <span>Inner<br>Quest</span>
      </button>

      <!-- 按钮 3: Random Quest -->
      <button class="quest-btn" onclick="selectQuest('random')">
        <!-- 提示: 替换你的 Random Quest 图标文件 -->
        <img src="icon_random_quest.png" alt="Random Quest" class="btn-icon">
        <span>Random<br>Quest</span>
      </button>
    </div>

    <!-- 4. QUEST 结果显示框 -->
    <div class="card-box display-box">
      <div class="quest-header-title">- QUEST -</div>
      
      <div class="quest-content-area" id="questContentArea">
        <p class="zh-text" id="zhDisplay">在安全的公共区域选一个方向走 5 分钟，再按原路或熟悉路线回来。</p>
        <p class="en-text" id="enDisplay">Walk in one direction for 5 minutes within a safe public area, then return via the same path or a familiar route.</p>
      </div>

      <!-- 5. 右下角 Instagram 贴纸按钮 -->
      <a href="https://www.instagram.com/yuxuantsuki" target="_blank" rel="noopener noreferrer" class="ig-badge-link">
        <!-- 提示: 替换你的 @yuxuantsuki 按钮图片 -->
        <img src="ig_badge.png" alt="@yuxuantsuki">
      </a>
    </div>

  </div>

  <script>
    /* ========================================================
       QUEST 数据库列表
       ======================================================== */
    
    // 1. Mini Adventure 任务库 (可自行添加/替换)
    const miniQuests = [
      {
        zh: "在安全的公共区域选一个方向走 5 分钟，再按原路或熟悉路线回来。",
        en: "Walk in one direction for 5 minutes within a safe public area, then return via the same path or a familiar route."
      },
      {
        zh: "去最近的便利店盲买一瓶你从没喝过的饮料。",
        en: "Go to the nearest convenience store and randomly buy a drink you have never tried before."
      },
      {
        zh: "寻找一条马路上带有“小动物”或“植物”图案的盖板，拍照记录。",
        en: "Find a manhole cover or sign with an animal or plant design on the street and take a picture."
      },
      {
        zh: "乘坐下一班到达的公交车，坐满 5 站后下车散步 10 分钟。",
        en: "Take the next arriving bus, ride for 5 stops, then get off and take a 10-minute walk."
      }
    ];

    // 2. Inner Quest 任务库 (可自行添加/替换)
    const innerQuests = [
      {
        zh: "闭上眼睛深呼吸 5 次，在心中对自己说一句“你今天做得很好”。",
        en: "Close your eyes, take 5 deep breaths, and tell yourself silently: 'You did great today.'"
      },
      {
        zh: "给一位很久没联系的好朋友发一条“突然想起你，祝你今天开心”。",
        en: "Send a quick message to a friend you haven't talked to in a while: 'Thinking of you, hope you have a great day!'"
      },
      {
        zh: "找一个安静的地方，认真感受太阳晒在皮肤上 2 分钟的温度。",
        en: "Find a quiet spot and quietly feel the warmth of the sun on your skin for 2 minutes."
      },
      {
        zh: "在备忘录里写下今天让你感到幸运或感谢的 3 件微小事物。",
        en: "Write down 3 tiny things in your notes that you felt lucky or grateful for today."
      }
    ];

    /* ========================================================
       交互逻辑: 2秒滚轮抽签
       ======================================================== */
    let isRolling = false;

    function selectQuest(type) {
      if (isRolling) return;
      isRolling = true;

      let pool = [];
      if (type === 'mini') {
        pool = miniQuests;
      } else if (type === 'inner') {
        pool = innerQuests;
      } else {
        // Random Quest: 合并 miniQuests 和 innerQuests (共200项)
        pool = [...miniQuests, ...innerQuests];
      }

      const contentArea = document.getElementById('questContentArea');
      const zhDisplay = document.getElementById('zhDisplay');
      const enDisplay = document.getElementById('enDisplay');

      contentArea.classList.add('rolling');

      const duration = 2000;    // 持续 2 秒
      const intervalTime = 60; // 每 60ms 快速变动一次
      let elapsedTime = 0;

      const timer = setInterval(() => {
        const tempIndex = Math.floor(Math.random() * pool.length);
        zhDisplay.textContent = pool[tempIndex].zh;
        enDisplay.textContent = pool[tempIndex].en;

        elapsedTime += intervalTime;

        if (elapsedTime >= duration) {
          clearInterval(timer);
          
          // 定格最终抽到的 Quest
          const finalIndex = Math.floor(Math.random() * pool.length);
          zhDisplay.textContent = pool[finalIndex].zh;
          enDisplay.textContent = pool[finalIndex].en;

          contentArea.classList.remove('rolling');
          isRolling = false;
        }
      }, intervalTime);
    }
  </script>
</body>
</html>
