<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKICHIP V2: DAILY SOLVER - QUEST</title>
  
  <!-- 引入 Google Fonts: Bagel Fat One, Baloo Bhaijaan 2 与 Ma Shan Zheng -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+Bhaijaan+2:wght@400;600;800&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  
  <style>
    /* 全局变量 */
    :root {
      --bg-color: #F8F6F3;        /* 背景颜色 */
      --main-color: #9B644F;      /* 主线条与主字体颜色 */
      --accent-color: #FCA125;    /* Quest 答案字颜色 */
      --card-bg: #FFFFFF;         /* 卡片背景 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 28px 50px;
      color: var(--main-color);
    }

    /* 手机端容器 */
    .mobile-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 1. 最顶部的画作与紧贴的圆角横线 */
    .top-illustration-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .top-illustration-img {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
    }

    /* 紧密粘着在图画下面的横线 */
    .top-tight-line {
      width: 100%;
      height: 3px;
      background-color: var(--main-color);
      border-radius: 3px;
      margin-top: 0;
    }

    /* 2. 主标题 */
    .main-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: clamp(16px, 5.2vw, 22px);
      font-weight: 400;
      color: var(--main-color);
      text-align: center;
      letter-spacing: 0.05em; /* 字体间距 +50 */
      white-space: nowrap;    /* 同一排 */
      width: 100%;
      margin-top: 2px;
      margin-bottom: 2px;
    }

    /* 3. 通用卡片外框 */
    .card-box {
      width: 100%;
      background: var(--card-bg);
      border: 3px solid var(--main-color);
      border-radius: 24px;
      position: relative;
    }

    /* 三按钮容器 */
    .options-box {
      padding: 18px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    /* 按钮样式与按压效果 */
    .quest-btn {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      outline: none;
      padding: 0 1px;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .quest-btn:active {
      transform: scale(0.8); /* 按下变小 20% */
    }

    /* PNG 图标 */
    .quest-btn-img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      margin-bottom: 2px;
      display: block;
    }

    /* 按钮文字 */
    .quest-btn span {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 12px;
      color: var(--main-color);
      text-align: center;
      letter-spacing: 0.05em; /* 字体间距 +50 */
      line-height: 1.25;
      text-transform: uppercase;
    }

    /* 4. Quest 展示区 */
    .display-box {
      padding: 24px 15px 60px 15px;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* - QUEST - 锁定同一排 */
    .quest-header-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 22px;
      color: var(--main-color);
      letter-spacing: 0.05em; /* 字体间距 +50 */
      white-space: nowrap;
      margin-bottom: 20px;
    }

    /* 动态任务文本区域 */
    .quest-content-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 0 18px;
      transition: opacity 0.1s ease;
    }

    .quest-content-area.rolling {
      filter: blur(1px);
      opacity: 0.7;
    }

    /* Quest 中文字体：Ma Shan Zheng，字号 14pt */
    .zh-text {
      font-family: 'Ma Shan Zheng', cursive, sans-serif;
      color: var(--accent-color);
      font-size: 14pt;
      line-height: 1.5;
      margin-bottom: 12px;
      word-break: break-word;
    }

    /* Quest 英文字体：Baloo Bhaijaan Regular */
    .en-text {
      font-family: 'Baloo Bhaijaan 2', 'Baloo Bhaijaan', cursive, sans-serif;
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.35;
      word-break: break-word;
    }

    /* 5. Instagram 按钮 */
    .ig-badge-link {
      position: absolute;
      bottom: -30px;
      right: -10px;
      text-decoration: none;
      z-index: 10;
      transition: transform 0.15s ease;
    }

    .ig-badge-link:active {
      transform: scale(0.8);
    }

    .ig-btn-img {
      height: 105px;
      width: auto;
      display: block;
    }
  </style>
</head>

      </a>
    </div>

    /* ========================================================
       2 秒滚轮抽签逻辑
       ======================================================== */
    let isRolling = false;

    function selectQuest(type) {
      if (isRolling) return;
      isRolling = true;

      let pool = [];
      if (type === 'mini') {
        pool = miniQuests;
      } else if (type === 'inner') {
        pool = innerQuests;
      } else {
        // Random Quest: 混合 Mini 与 Inner (共 200 项)
        pool = [...miniQuests, ...innerQuests];
      }

      const contentArea = document.getElementById('questContentArea');
      const zhDisplay = document.getElementById('zhDisplay');
      const enDisplay = document.getElementById('enDisplay');

      contentArea.classList.add('rolling');

      const duration = 2000;    // 2秒
      const intervalTime = 60;  // 60ms 快速轮播
      let elapsedTime = 0;

      const timer = setInterval(() => {
        const tempIndex = Math.floor(Math.random() * pool.length);
        zhDisplay.textContent = pool[tempIndex].zh;
        enDisplay.textContent = pool[tempIndex].en;

        elapsedTime += intervalTime;

        if (elapsedTime >= duration) {
          clearInterval(timer);
          
          const finalIndex = Math.floor(Math.random() * pool.length);
          zhDisplay.textContent = pool[finalIndex].zh;
          enDisplay.textContent = pool[finalIndex].en;

          contentArea.classList.remove('rolling');
          isRolling = false;
        }
      }, intervalTime);
    }
