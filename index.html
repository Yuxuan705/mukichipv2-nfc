<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKICHIP V2: DAILY SOLVER - QUEST</title>
  
  <!-- 引入 Google Fonts: Bagel Fat One, Baloo Bhaijaan 2 与 Ma Shan Zheng -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+Bhaijaan+2:wght@400;600;800&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  
  <style>
    /* 全局变量 */
    :root {
      --bg-color: #F8F6F3;        /* 背景颜色 */
      --main-color: #9B644F;      /* 主线条与主字体颜色 */
      --accent-color: #FCA125;    /* Quest 答案字颜色 */
      --card-bg: #FFFFFF;         /* 卡片背景 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 28px 50px;
      color: var(--main-color);
    }

    /* 手机端容器 */
    .mobile-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 1. 最顶部的画作与紧贴的圆角横线 */
    .top-illustration-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .top-illustration-img {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
    }

    /* 紧密粘着在图画下面的横线 */
    .top-tight-line {
      width: 100%;
      height: 3px;
      background-color: var(--main-color);
      border-radius: 3px;
      margin-top: 0;
    }

    /* 2. 主标题 */
    .main-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: clamp(16px, 5.2vw, 22px);
      font-weight: 400;
      color: var(--main-color);
      text-align: center;
      letter-spacing: 0.05em; /* 字体间距 +50 */
      white-space: nowrap;    /* 同一排 */
      width: 100%;
      margin-top: 2px;
      margin-bottom: 2px;
    }

    /* 3. 通用卡片外框 */
    .card-box {
      width: 100%;
      background: var(--card-bg);
      border: 3px solid var(--main-color);
      border-radius: 24px;
      position: relative;
    }

    /* 三按钮容器 */
    .options-box {
      padding: 18px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    /* 按钮样式与按压效果 */
    .quest-btn {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      outline: none;
      padding: 0 1px;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .quest-btn:active {
      transform: scale(0.8);
    }

    /* PNG 图标 */
    .quest-btn-img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      margin-bottom: 2px;
      display: block;
    }

    /* 按钮文字 */
    .quest-btn span {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 12px;
      color: var(--main-color);
      text-align: center;
      letter-spacing: 0.05em;
      line-height: 1.25;
      text-transform: uppercase;
    }

    /* 4. Quest 展示区 */
    .display-box {
      padding: 24px 15px 60px 15px;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* - QUEST - 锁定同一排 */
    .quest-header-title {
      font-family: 'Bagel Fat One', cursive, sans-serif;
      font-size: 22px;
      color: var(--main-color);
      letter-spacing: 0.05em;
      white-space: nowrap;
      margin-bottom: 20px;
    }

    /* 动态任务文本区域 */
    .quest-content-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 0 18px;
      transition: opacity 0.1s ease;
    }

    .quest-content-area.rolling {
      filter: blur(1px);
      opacity: 0.7;
    }

    /* Quest 中文字体：Ma Shan Zheng，字号 14pt */
    .zh-text {
      font-family: 'Ma Shan Zheng', cursive, sans-serif;
      color: var(--accent-color);
      font-size: 14pt;
      line-height: 1.5;
      margin-bottom: 12px;
      word-break: break-word;
    }

    /* Quest 英文字体：Baloo Bhaijaan Regular */
    .en-text {
      font-family: 'Baloo Bhaijaan 2', 'Baloo Bhaijaan', cursive, sans-serif;
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.35;
      word-break: break-word;
    }

    /* 5. Instagram 按钮（位置微调：往下 & 往右） */
    .ig-badge-link {
      position: absolute;
      bottom: -40px; /* 从 -30px 调至 -40px，下移 */
      right: -20px;  /* 从 -10px 调至 -20px，右移 */
      text-decoration: none;
      z-index: 10;
      transition: transform 0.15s ease;
    }

    .ig-badge-link:active {
      transform: scale(0.8);
    }

    .ig-btn-img {
      height: 105px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- 1. 顶部图画 + 紧贴的圆边横线 -->
    <div class="top-illustration-wrapper">
      <img src="top-muki.png" alt="Muki Illustration" class="top-illustration-img" onerror="this.style.display='none'">
      <div class="top-tight-line"></div>
    </div>

    <!-- 2. 主标题 -->
    <h1 class="main-title">MUKICHIP V2: DAILY SOLVER</h1>

    <!-- 3. 三按钮选框 -->
    <div class="card-box options-box">
      
      <!-- 按钮 1: MINI ADVENTURE -->
      <button class="quest-btn" onclick="selectQuest('mini')">
        <img src="mini-icon.png" alt="Mini Adventure" class="quest-btn-img">
        <span>MINI<br>ADVENTURE</span>
      </button>

      <!-- 按钮 2: INNER QUEST -->
      <button class="quest-btn" onclick="selectQuest('inner')">
        <img src="inner-icon.png" alt="Inner Quest" class="quest-btn-img">
        <span>INNER<br>QUEST</span>
      </button>

      <!-- 按钮 3: RANDOM QUEST -->
      <button class="quest-btn" onclick="selectQuest('random')">
        <img src="random-icon.png" alt="Random Quest" class="quest-btn-img">
        <span>RANDOM<br>QUEST</span>
      </button>

    </div>

    <!-- 4. Quest 结果卡片 -->
    <div class="card-box display-box">
      <div class="quest-header-title">- QUEST -</div>
      
      <div class="quest-content-area" id="questContentArea">
        <p class="zh-text" id="zhDisplay">在安全的公共区域选一个方向走 5 分钟，再按原路或熟悉路线回来。</p>
        <p class="en-text" id="enDisplay">Walk in one direction for 5 minutes within a safe public area, then return via the same path or a familiar route.</p>
      </div>

      <!-- 5. 右下角 Instagram 图片按钮 -->
      <a href="https://www.instagram.com/yuxuantsuki" target="_blank" rel="noopener noreferrer" class="ig-badge-link">
        <img src="ig-button.png" alt="@yuxuantsuki" class="ig-btn-img">
      </a>
    </div>

  </div>

  <script>
    /* ========================================================
       QUEST 任务数据池
       ======================================================== */
    
    // 1. Mini Adventure
